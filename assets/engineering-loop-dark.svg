<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 360 120" role="img" aria-labelledby="title desc">
  <title id="title">Engineering loop</title>
  <desc id="desc">A four-stage loop: make it work, make it right, make it fast, and prove it with an eval.</desc>

  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .connector { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #6e7681; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .label { fill: #f0f6fc; font: 600 9px "Fira Code", "SFMono-Regular", Consolas, monospace; letter-spacing: 0.15px; text-anchor: middle; dominant-baseline: middle; }
      .index { fill: #8b949e; font: 600 6px "Fira Code", "SFMono-Regular", Consolas, monospace; letter-spacing: 0.35px; }
      .runner { fill: #58a6ff; filter: url(#glow); }
      @media (prefers-reduced-motion: reduce) {
        .runner { display: none; }
      }
    </style>
  </defs>

  <path class="connector" d="M160 29H200M275 48V72M200 91H160M85 72V48"/>
  <path class="arrow" d="M188 25l5 4-5 4M271 62l4 5 4-5M172 87l-5 4 5 4M81 58l4-5 4 5"/>

  <g class="runner" aria-hidden="true">
    <circle cy="29" r="2.6">
      <animate attributeName="cx" values="160;200;200;200;200" keyTimes="0;0.25;0.5;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.249;0.25;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
    </circle>
    <circle cx="275" r="2.6">
      <animate attributeName="cy" values="48;48;72;72;72" keyTimes="0;0.25;0.5;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.25;0.499;0.5;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
    </circle>
    <circle cy="91" r="2.6">
      <animate attributeName="cx" values="200;200;200;160;160" keyTimes="0;0.25;0.5;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.499;0.5;0.749;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" r="2.6">
      <animate attributeName="cy" values="72;72;72;72;48" keyTimes="0;0.25;0.5;0.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.5;0.749;0.75;0.999;1" dur="10s" calcMode="linear" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect class="node" x="10" y="10" width="150" height="38" rx="9"/>
    <text class="index" x="18" y="20">01</text>
    <text class="label" x="85" y="30">MAKE IT WORK</text>

    <rect class="node" x="200" y="10" width="150" height="38" rx="9"/>
    <text class="index" x="208" y="20">02</text>
    <text class="label" x="275" y="30">MAKE IT RIGHT</text>

    <rect class="node" x="200" y="72" width="150" height="38" rx="9"/>
    <text class="index" x="208" y="82">03</text>
    <text class="label" x="275" y="92">MAKE IT FAST</text>

    <rect class="node" x="10" y="72" width="150" height="38" rx="9"/>
    <text class="index" x="18" y="82">04</text>
    <text class="label" x="85" y="92">PROVE WITH AN EVAL</text>
  </g>
</svg>